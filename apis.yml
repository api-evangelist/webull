aid: webull
name: Webull
description: >-
  Webull is a commission-free online brokerage whose Webull OpenAPI platform gives
  quantitative and algorithmic traders programmatic access to trading and market
  data across US and Hong Kong regions. It exposes four API products — a Trading API
  (place/preview/replace/cancel orders for stocks, options, futures, crypto, and
  event contracts, including combo OTO/OCO/OTOCO and TWAP/VWAP/POV algo orders), a
  Market Data API (real-time and historical snapshots, ticks, quotes/depth, footprint
  and OHLCV bars), a Broker API (enterprise account opening, funding, and cash
  journals), and a Connect API (OAuth 2.0 third-party authorization). Requests are
  authenticated with an App Key / App Secret pair and HMAC-SHA1 request signing, with
  real-time streaming over gRPC (trading events) and MQTT (market data). Webull ships
  official Python and Java SDKs, a Go CLI, a published MCP server, and an Agent Skill.
