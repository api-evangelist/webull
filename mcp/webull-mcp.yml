generated: '2026-07-21'
method: searched
status: published
source: https://github.com/webull-inc/webull-openapi-mcp
servers:
  - name: webull-openapi-mcp
    kind: local
    transport: stdio
    install: uvx webull-openapi-mcp serve
    package: https://pypi.org/project/webull-openapi-mcp/
    repo: https://github.com/webull-inc/webull-openapi-mcp
    description: >-
      Official local MCP server (formerly webull-mcp-server). Lets AI assistants
      (Cursor, Claude Desktop, Kiro) securely trade and read market data via the
      Webull OpenAPI Python SDK. US and HK regions. Defaults to UAT sandbox; live
      trading requires WEBULL_ENVIRONMENT=prod. Credentials via WEBULL_APP_KEY /
      WEBULL_APP_SECRET env vars only (never pasted to the model). Built-in risk
      controls (notional/quantity limits, symbol whitelist), audit logging, 2FA.
    config_env:
      - WEBULL_APP_KEY
      - WEBULL_APP_SECRET
      - WEBULL_REGION_ID   # us | hk
      - WEBULL_ENVIRONMENT # uat (default) | prod
      - WEBULL_TOOLSETS
  - name: Webull Cloud MCP Server
    kind: hosted
    transport: http
    status: published
    source: https://developer.webull.com/apis/docs/changelog
    description: >-
      Webull-hosted remote MCP server. Per the 2026-07-13 changelog it added 24 tools
      including stock capital flow, filings, earnings calendar, fund ratings, and
      financial indicators. Connection details published in the developer docs.
toolsets:
  market_data:
